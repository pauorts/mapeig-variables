server {
    listen 80;
    server_name _; # Acepta peticiones desde cualquier IP/dominio interno

    # Regla 1: Si alguien pide la ruta /static/ (CSS, JS, imágenes...)
    location /static/ {
        # Nginx los sirve directamente desde esta carpeta sin molestar a FastAPI
        alias /usr/share/nginx/html/static/; 
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Regla 2: Cualquier otra petición (la API, rutas de backend, etc.)
    location / {
        # Se la pasamos al contenedor de FastAPI (llamado "backend" en el docker-compose)
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}